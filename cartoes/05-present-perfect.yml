    tags: [present-perfect]
  - frente: "I ___ (live) in London in 2015."
    verso: "lived"
    exemplo: "Ano fechado no passado, assunto encerrado — Past Simple."
    nota: "202609161430"
    tags: [past-simple]
  - frente: "for ou since? ___ three years"
    verso: "for three years"
    exemplo: "'for' + duração; 'since' + ponto de partida."
    nota: "202609161502"
    tags: [for-since]
  - frente: "for ou since? ___ Monday"
    verso: "since Monday"
    exemplo: "Segunda-feira é um ponto no tempo, não uma duração."
    nota: "202609161502"
    tags: [for-since]
